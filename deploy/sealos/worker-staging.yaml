apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: inbox-server-warp-state
  namespace: ns-tbs948af
  annotations:
    path: /var/lib/cloudflare-warp
    value: "1"
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: inbox-server-worker-staging
  namespace: ns-tbs948af
  annotations:
    originImageName: ghcr.nju.edu.cn/v-yutianran/inbox-server-worker@sha256:1121f1cde80c257aa3512c36f772260808836c9f1bcd15c1e2f9a49e85b3c9aa
    inbox.yutianran.cn/warp-image: ghcr.nju.edu.cn/v-yutianran/inbox-server-worker@sha256:04ba57c848686946be667f730e912090eddffa3f003e932ea20acfa440eb36d6
    deploy.cloud.sealos.io/minReplicas: "1"
    deploy.cloud.sealos.io/maxReplicas: "1"
  labels:
    app: inbox-server-worker-staging
    cloud.sealos.io/app-deploy-manager: inbox-server-worker-staging
spec:
  replicas: 1
  revisionHistoryLimit: 1
  serviceName: inbox-server-worker-staging
  selector:
    matchLabels:
      app: inbox-server-worker-staging
  template:
    metadata:
      labels:
        app: inbox-server-worker-staging
        cloud.sealos.io/app-deploy-manager: inbox-server-worker-staging
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1001
        runAsGroup: 1001
        runAsNonRoot: true
        runAsUser: 1001
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      containers:
        - name: inbox-server-worker-staging
          image: ghcr.nju.edu.cn/v-yutianran/inbox-server-worker@sha256:1121f1cde80c257aa3512c36f772260808836c9f1bcd15c1e2f9a49e85b3c9aa
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          env:
            - name: ARTICLE_REPOSITORY_URL
              value: https://github.com/v-yutianran/.agents.git
            - name: CHANNELS_PATH
              value: /app/channels.yaml
            - name: CONTROL_PLANE_URL
              value: https://inbox-api.yutianran.cn
            - name: DISPLAY
              value: :99
            - name: HEALTH_PORT
              value: "8080"
            - name: HTTP_PROXY
              value: http://127.0.0.1:40001
            - name: HTTPS_PROXY
              value: http://127.0.0.1:40001
            - name: NO_PROXY
              value: 127.0.0.1,localhost
            - name: OUTBOUND_PROXY_PORT
              value: "40001"
            - name: OUTBOUND_PROXY_READY_TIMEOUT_MS
              value: "60000"
            - name: PERSISTENCE_ROOT
              value: /data
            - name: WARP_SOCKS_PROXY_URL
              value: socks5://127.0.0.1:40000
            - name: WORKER_PROCESSING_ENABLED
              value: "true"
            - name: TZ
              value: Asia/Shanghai
          envFrom:
            - secretRef:
                name: inbox-server-worker-runtime
          ports:
            - name: health
              containerPort: 8080
              protocol: TCP
          startupProbe:
            httpGet:
              path: /readyz
              port: health
            failureThreshold: 60
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            tcpSocket:
              port: health
            failureThreshold: 3
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            failureThreshold: 3
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          volumeMounts:
            - name: vn-data
              mountPath: /data
        - name: warp-egress
          image: ghcr.nju.edu.cn/v-yutianran/inbox-server-worker@sha256:04ba57c848686946be667f730e912090eddffa3f003e932ea20acfa440eb36d6
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          env:
            - name: WARP_PROXY_PORT
              value: "40000"
          startupProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - /bin/warp-cli --accept-tos --no-ansi status | grep -q Connected
            failureThreshold: 30
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - /bin/warp-cli --accept-tos --no-ansi status | grep -q Connected
            failureThreshold: 3
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - /bin/warp-cli --accept-tos --no-ansi status | grep -q Connected
            failureThreshold: 3
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          volumeMounts:
            - name: warp-state
              mountPath: /var/lib/cloudflare-warp
            - name: warp-run
              mountPath: /run/cloudflare-warp
            - name: warp-logs
              mountPath: /var/log/cloudflare-warp
      volumes:
        - name: warp-state
          persistentVolumeClaim:
            claimName: inbox-server-warp-state
        - name: warp-run
          emptyDir: {}
        - name: warp-logs
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: vn-data
        annotations:
          path: /data
          value: "1"
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
