services:
  worker:
    image: ghcr.nju.edu.cn/v-yutianran/inbox-server-worker@sha256:2fa7eb7188e71a7a777570431e2ef7e58791fa56ca7505c9dfc8dcb8288acdd8
    platform: linux/amd64
    restart: unless-stopped
    environment:
      DISPLAY: :99
      HEALTH_PORT: "8080"
      TZ: Asia/Shanghai
    healthcheck:
      test:
        - CMD
        - node
        - apps/worker/dist/healthcheck.js
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    volumes:
      - worker-data:/data

volumes:
  worker-data:
