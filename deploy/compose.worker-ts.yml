services:
  worker:
    image: ghcr.nju.edu.cn/v-yutianran/inbox-server-worker@sha256:5ab3f4b6838d098bb4a040eef8548d31c63c0e9e1b2ffb1c14331767cebc78d3
    platform: linux/amd64
    restart: unless-stopped
    environment:
      BROWSER_LAUNCH_TIMEOUT_MS: "900000"
      DISPLAY: :99
      HEALTH_PORT: "8080"
      TZ: Asia/Shanghai
    healthcheck:
      test:
        - CMD
        - node
        - apps/worker/dist/healthcheck.js
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    volumes:
      - worker-data:/data

volumes:
  worker-data:
