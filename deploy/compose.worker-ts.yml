services:
  worker:
    image: ghcr.nju.edu.cn/v-yutianran/inbox-server-worker@sha256:0d34bea391a75c734c231eadbcd72ec116d552d6f2e9d7d6e347b1bc545a1e48
    platform: linux/amd64
    restart: unless-stopped
    environment:
      DISPLAY: :99
      HEALTH_PORT: "8080"
      TZ: Asia/Shanghai
    healthcheck:
      test:
        - CMD
        - node
        - apps/worker/dist/healthcheck.js
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    volumes:
      - worker-data:/data

volumes:
  worker-data:
