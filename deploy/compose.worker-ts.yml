services:
  worker:
    image: ghcr.nju.edu.cn/v-yutianran/inbox-server-worker@sha256:1d857f2f56609197c4d568a613dc19c6c81492c4c93d2d475efafe9785ce7ad9
    platform: linux/amd64
    restart: unless-stopped
    environment:
      BROWSER_LAUNCH_TIMEOUT_MS: "900000"
      DISPLAY: :99
      HEALTH_PORT: "8080"
      TZ: Asia/Shanghai
    healthcheck:
      test:
        - CMD
        - node
        - apps/worker/dist/healthcheck.js
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    volumes:
      - worker-data:/data

volumes:
  worker-data:
