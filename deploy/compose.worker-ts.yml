services:
  worker:
    image: ghcr.nju.edu.cn/v-yutianran/inbox-server-worker@sha256:55c7c970fa5694759b9f09817dad81e1b31d14687b975af03b3bef92e899a799
    platform: linux/amd64
    restart: unless-stopped
    environment:
      BROWSER_LAUNCH_TIMEOUT_MS: "900000"
      DISPLAY: :99
      HEALTH_PORT: "8080"
      TZ: Asia/Shanghai
    healthcheck:
      test:
        - CMD
        - node
        - apps/worker/dist/healthcheck.js
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    volumes:
      - worker-data:/data

volumes:
  worker-data:
